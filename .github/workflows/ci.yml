name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Name pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      # Both also write a Markdown overview to the run's summary page (as
      # Vitest does by itself); the annotate-failures plugin marks failing
      # tests in the diff.
      - run: >-
          uv run pytest --md-report --md-report-flavor gfm
          --md-report-color never --md-report-zeros empty
          --md-report-output "$GITHUB_STEP_SUMMARY"
      - name: Check the name files
        if: ${{ !cancelled() }}
        run: uv run python names/check.py --summary "$GITHUB_STEP_SUMMARY"
      # The committed build outputs (names.json, dialects.json, the dialect
      # areas, the objects file) must be what the committed inputs give.
      - name: Check the build outputs against their inputs
        if: ${{ !cancelled() }}
        run: uv run just check
      - name: Shellcheck
        if: ${{ !cancelled() }}
        run: uv run shellcheck tiles/*.sh web/scripts/*.sh

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:build

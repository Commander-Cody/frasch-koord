name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Name pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      # Every Python-side check, all of them even after a failure (the
      # justfile lists them). pytest and `frasch check-inputs` also write a Markdown
      # overview to the run's summary page (as Vitest does by itself); the
      # annotate-failures plugin marks failing tests in the diff.
      - run: uv run just check-python

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # lint, format, types and tests, all of them even after a failure
      - run: npm run check
      # The glyphs and the pinned tile archive (~130 MB), kept between runs
      # under a key that changes with whatever pins them.
      - uses: actions/cache@v6
        with:
          path: |
            web/public/fonts
            web/.cache/tiles
          key: web-assets-${{ hashFiles('web/tiles.lock', 'web/fonts.lock', 'web/scripts/fetch-fonts.sh') }}
      - run: npm run fetch-assets
      - run: npx playwright install --with-deps chromium-headless-shell
      # builds the site (checking dist/), then smoke-tests it
      - run: npm run smoke

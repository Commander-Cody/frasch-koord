[project]
name = "frasch-maps"
version = "0.0.0"
description = "North Frisian place-name map: name pipeline and tile build (the frasch package)"
requires-python = ">=3.12"
dependencies = [
    "osmium>=3.7",
    "shapely>=2.0",
    "requests",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "mapbox-vector-tile>=2.2.0",
    "mypy>=2.3.1",
    "pmtiles>=3.8.1",
    "pytest",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pytest-md-report>=0.8.0",
    "ruff",
    "rust-just>=1.58.0",
    "shellcheck-py>=0.11.0.1",
    "types-jsonschema>=4.26.0.20260518",
    "types-shapely>=2.1.0.20260728",
]

# Every command of the pipeline: `uv run frasch <command>` (frasch/__main__.py
# holds the table).
[project.scripts]
frasch = "frasch.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# The pipeline's code is the `frasch` package at the repo root; uv installs it
# editable, so the `frasch` script and the tests import it without any
# sys.path set-up.
[tool.uv.build-backend]
module-name = "frasch"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["names/tests", "tiles/tests", "scripts/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# the agent worktrees are whole checkouts of other branches
extend-exclude = [".claude/worktrees"]

[tool.ruff.lint]
# PLR0915: at most 50 statements per function (#43)
select = ["F", "E9", "B", "PLR0915"]

# Strict everywhere, tests included (#44).  names/tests is on the path for the
# fixture helpers the tile tests import too (`conftest`, `osm_fixture`).
[tool.mypy]
python_version = "3.12"
strict = true
files = ["frasch", "names/tests", "tiles/tests", "scripts"]
mypy_path = "names/tests"
# pmtiles ships py.typed, but its functions are not annotated
untyped_calls_exclude = ["pmtiles"]

[[tool.mypy.overrides]]
module = ["mapbox_vector_tile"]
ignore_missing_imports = true
